name: Integration

# Exercises the library as PUBLISHED, against staging. CI builds this working
# tree; nothing there would notice a tag that never landed, a `paths` list that
# leaves a source file out of the package, or a module name a consumer cannot
# import. Zig has no central registry, so the release under test is a git TAG.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind
    # everyone else's and can be dropped entirely under load.
    - cron: '51 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile holds the one pin, so CI cannot drift from the toolchain
      # the library is developed against.
      - id: toolchain
        run: echo "zig=$(awk -F= '/^ARG ZIG_VERSION=/ { print $2 }' scripts/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.toolchain.outputs.zig }}
      # One entry point, used identically by a human and by this job: it skips
      # with a reason when no tag satisfies the declared range, and each tier
      # whose key is missing skips from inside the suite.
      #
      # One org per plan tier, because the tier comes from the ORG rather than
      # from the key. A secret that does not exist interpolates to an empty
      # string here, which the suite treats as absent.
      - run: ./scripts/run.sh
        working-directory: integration
        env:
          VPNDETECTION_STAGING_KEY_FREE: ${{ secrets.VPNDETECTION_STAGING_KEY_FREE }}
          VPNDETECTION_STAGING_KEY_STARTER: ${{ secrets.VPNDETECTION_STAGING_KEY_STARTER }}
          VPNDETECTION_STAGING_KEY_SCALE: ${{ secrets.VPNDETECTION_STAGING_KEY_SCALE }}
          VPNDETECTION_STAGING_KEY_MAX: ${{ secrets.VPNDETECTION_STAGING_KEY_MAX }}
